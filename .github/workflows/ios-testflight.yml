name: iOS build to TestFlight

# Builds the iPhone app on a GitHub-hosted Mac and uploads it to App Store Connect (TestFlight). Run it by hand: Actions > "iOS build to TestFlight" > Run workflow.
# One-time setup is in APP.md ("iOS without a Mac"). Needs these repository secrets:
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the App Store Connect API key's .p8 file, base64-encoded),
#   VITE_GOOGLE_MAPS_API_KEY, VITE_SUPABASE_ANON_KEY (the same ones the website build uses)

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # Apple only accepts apps built with the iOS 26 SDK (Xcode 26) or later: use the newest Xcode 26 on the runner
      - name: Use Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # the website, then copied into the iOS project
      - run: npm run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npx cap sync ios

      - name: Put the App Store Connect key on disk
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "${{ secrets.ASC_KEY_P8 }}" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"

      # Archive WITHOUT signing. A fresh runner has no certificate, so signing here made Xcode create a new "Apple Development" certificate on every
      # run until the account hit Apple's certificate limit ("Choose a certificate to revoke"). The export step below signs for the App Store instead,
      # with the cloud-managed distribution certificate, so nothing is created per run.
      # Every upload needs a build number higher than the last one: the run number does.
      - name: Archive (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild archive             -project App.xcodeproj -scheme App -configuration Release             -destination 'generic/platform=iOS'             -archivePath "$RUNNER_TEMP/App.xcarchive"             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"             CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export and upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
