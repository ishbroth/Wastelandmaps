name: iOS build to TestFlight

# Builds the iPhone app on a GitHub-hosted Mac and uploads it to App Store Connect (TestFlight). Run it by hand: Actions > "iOS build to TestFlight" > Run workflow.
# One-time setup is in APP.md ("iOS without a Mac"). Needs these repository secrets:
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the App Store Connect API key's .p8 file: its text pasted as it is, or base64-encoded),
#   VITE_GOOGLE_MAPS_API_KEY, VITE_SUPABASE_ANON_KEY (the same ones the website build uses)

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # Apple only accepts apps built with the iOS 26 SDK (Xcode 26) or later: use the newest Xcode 26 on the runner
      - name: Use Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # the website, then copied into the iOS project
      - run: npm run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npx cap sync ios

      # The secret can be the .p8 file's text pasted as it is (with its BEGIN and END lines) or that text base64-encoded: either works.
      - name: Put the App Store Connect key on disk
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_FILE="$RUNNER_TEMP/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            # 1. the .p8 text as it is, with its BEGIN and END lines
            printf '%s\n' "$ASC_KEY_P8" > "$KEY_FILE"
          else
            BODY=$(printf '%s' "$ASC_KEY_P8" | tr -d ' \r\n')
            DECODED=$(printf '%s' "$BODY" | base64 --decode 2>/dev/null || true)
            if printf '%s' "$DECODED" | head -c 40 | grep -q "BEGIN PRIVATE KEY"; then
              # 2. the whole .p8 file, base64-encoded
              printf '%s\n' "$DECODED" > "$KEY_FILE"
            else
              # 3. only the lines between BEGIN and END: put the BEGIN and END lines back
              { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$BODY" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$KEY_FILE"
            fi
          fi
          head -1 "$KEY_FILE" | grep -q "BEGIN PRIVATE KEY" || { echo "ASC_KEY_P8 is not a .p8 key"; exit 1; }
          # a last check that the file really is a usable key (without printing any of it)
          openssl pkey -in "$KEY_FILE" -noout || { echo "ASC_KEY_P8 could not be read as a private key"; exit 1; }

      # Archive WITHOUT signing. A fresh runner has no certificate, so signing here made Xcode create a new "Apple Development" certificate on every
      # run until the account hit Apple's certificate limit ("Choose a certificate to revoke"). The export step below signs for the App Store instead,
      # with the cloud-managed distribution certificate, so nothing is created per run.
      # Every upload needs a build number higher than the last one: the run number does.
      - name: Archive (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild archive             -project App.xcodeproj -scheme App -configuration Release             -destination 'generic/platform=iOS'             -archivePath "$RUNNER_TEMP/App.xcarchive"             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"             CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      # Says where this build is going, so it is easy to check against the App Store Connect account you expect (partial IDs only; nothing secret is printed)
      - name: Where this build is going
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          INFO="$RUNNER_TEMP/App.xcarchive/Info.plist"
          echo "Bundle ID:     $(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$INFO")"
          echo "Version:       $(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$INFO")"
          echo "Build number:  $(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleVersion' "$INFO")"
          echo "Team ID ends:  ...${TEAM: -3}   (compare with developer.apple.com > Membership details)"
          echo "API key ID ends: ...${KEY: -4}   (it should be the key you made in the account you expect)"
          echo "Issuer ID:     ${ISSUER:0:8}...   (this is the issuer shown on that account's Integrations page)"

      - name: Export and upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
